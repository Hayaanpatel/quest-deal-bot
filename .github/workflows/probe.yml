name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pricespy
        run: |
          curl -sS -L -m 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' -H 'Accept-Language: en-GB,en;q=0.9' -o /tmp/p.html "https://pricespy.co.uk/product.php?p=13883509"
          python3 - <<'PY'
          import re
          h=open('/tmp/p.html',encoding='utf-8').read()
          for m in re.findall(r'<script[^>]*ld\+json[^>]*>(.*?)</script>',h,re.S): print('LD:',m[:1500]); print()
          PY
          NTFY_TOPIC= python3 watcher.py --once --dry-run | head
